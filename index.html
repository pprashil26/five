<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Five</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f5;
      --surface: #ffffff;
      --text: #1d232a;
      --muted: #69717c;
      --line: #e2e4e7;
      --accent: #2858c7;
      --accent-soft: #eef3ff;
      --danger: #b42318;
      --done: #858b93;
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    html {
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-width: 280px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.4;
      -webkit-tap-highlight-color: transparent;
    }

    button, input, textarea { font: inherit; }
    button { touch-action: manipulation; }

    .app {
      width: 100%;
      max-width: 600px;
      min-height: 100dvh;
      margin: 0 auto;
      padding:
        max(8px, env(safe-area-inset-top))
        max(10px, env(safe-area-inset-right))
        max(14px, env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 4px 0 8px;
      background: rgba(247, 247, 245, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 7px;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 21px;
      line-height: 1.2;
      letter-spacing: -0.45px;
    }

    .count {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .view-tabs {
      display: flex;
      align-items: center;
      gap: 2px;
      min-width: 0;
    }

    .view-tab {
      min-height: 28px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      padding: 4px 6px;
      font-size: 11px;
      white-space: nowrap;
    }

    .view-tab.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .view-tab span { font-weight: 780; }

    button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      padding: 6px 10px;
      font-weight: 680;
      cursor: pointer;
    }

    button:active { transform: translateY(1px); }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 2px solid rgba(40, 88, 199, 0.4);
      outline-offset: 1px;
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
      transform: none;
    }

    .add-task {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      white-space: nowrap;
    }

    .tasks {
      display: grid;
      gap: 8px;
    }

    .task {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .task.top-focus {
      background: #fff9db;
      border-color: #eee3a7;
    }

    .task-view {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 6px;
      padding: 10px 10px 10px 6px;
    }

    .task-content { min-width: 0; }

    .drag-handle {
      align-self: stretch;
      min-width: 24px;
      min-height: 42px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #9aa0a8;
      padding: 0;
      font-size: 19px;
      font-weight: 700;
      line-height: 1;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .drag-handle:active { cursor: grabbing; }

    .task.dragging {
      position: relative;
      z-index: 20;
      opacity: 0.96;
      border-color: #9bb2e8;
      box-shadow: 0 5px 16px rgba(29, 35, 42, 0.14);
    }

    .task.drag-over-before { box-shadow: inset 0 3px 0 var(--accent); }
    .task.drag-over-after { box-shadow: inset 0 -3px 0 var(--accent); }

    body.reordering {
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .requestor {
      overflow-wrap: anywhere;
      color: var(--accent);
      font-size: 12px;
      font-weight: 760;
      line-height: 1.3;
    }

    .title-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 8px;
      margin-top: 2px;
    }

    .task-title {
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 17px;
      font-weight: 760;
      line-height: 1.3;
      letter-spacing: -0.15px;
    }

    .edit-button {
      min-height: 28px;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 2px 4px;
      font-size: 12px;
    }

    .description {
      margin: 6px 0 0;
      overflow-wrap: anywhere;
      color: #4f5863;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .actions {
      display: grid;
      gap: 2px;
      margin-top: 8px;
    }

    .action-view {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      align-items: start;
      gap: 4px;
      min-height: 30px;
      border-radius: 7px;
      padding: 3px 2px;
    }

    .action-view:hover { background: #fafafa; }

    .action-view input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 2px 0 0;
      accent-color: var(--accent);
    }

    .action-text {
      min-width: 0;
      overflow-wrap: anywhere;
      padding-top: 1px;
      font-size: 15px;
    }

    .action-view.done .action-text {
      color: var(--done);
      text-decoration: line-through;
    }

    .no-actions {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .task-editor {
      display: none;
      padding: 9px;
    }

    .task.editing .task-view { display: none; }
    .task.editing .task-editor { display: block; }

    .field { margin-bottom: 6px; }

    input[type="text"], textarea {
      display: block;
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--text);
      padding: 7px 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 58px;
      resize: vertical;
    }

    input::placeholder, textarea::placeholder { color: #8a919a; }

    .editor-heading {
      margin: 7px 0 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 760;
      text-transform: uppercase;
      letter-spacing: 0.35px;
    }

    .action-edit-list {
      display: grid;
      gap: 4px;
    }

    .action-edit-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 34px;
      gap: 4px;
    }

    .remove-action {
      min-width: 34px;
      min-height: 36px;
      border: 0;
      color: var(--muted);
      padding: 2px;
      font-size: 19px;
      font-weight: 450;
    }

    .editor-tools {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 4px;
      margin-top: 7px;
    }

    .add-action {
      background: var(--accent-soft);
      border-color: #d9e3fa;
      color: var(--accent);
    }

    
    .philosophy {
      margin: 0 0 8px;
      padding: 7px 10px;
      border-radius: 8px;
      background: #f1f3f5;
      color: #69717c;
      font-size: 11px;
      line-height: 1.35;
    }

    .archive-task { color: #6b5600; }
    .delete-task { color: var(--danger); }

    .archive-card { padding: 10px; }

    .archive-date {
      margin-top: 7px;
      color: var(--muted);
      font-size: 11px;
    }

    .archive-actions-static {
      display: grid;
      gap: 3px;
      margin-top: 8px;
    }

    .archive-action-static {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: 6px;
      color: #4f5863;
      font-size: 14px;
    }

    .archive-action-static.done { color: var(--done); }
    .archive-action-static.done span:last-child { text-decoration: line-through; }

    .archive-tools {
      display: flex;
      justify-content: flex-end;
      gap: 5px;
      margin-top: 8px;
    }

    .restore-task {
      background: var(--accent-soft);
      border-color: #d9e3fa;
      color: var(--accent);
    }

    .empty {
      border: 1px dashed #cdd1d5;
      border-radius: var(--radius);
      padding: 28px 14px;
      color: var(--muted);
      text-align: center;
    }

    .empty strong {
      display: block;
      margin-bottom: 2px;
      color: var(--text);
      font-size: 15px;
    }

    .footer {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    .footer button {
      min-height: 30px;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 4px 8px;
      font-size: 11px;
    }

    .status {
      min-height: 17px;
      padding-top: 4px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    .hidden { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1>Five</h1>
        <nav class="view-tabs" aria-label="Task views">
          <button type="button" class="view-tab active" id="activeTab">Active <span id="taskCount">0/5</span></button>
          <button type="button" class="view-tab" id="archiveTab">Archive <span id="archiveCount">0</span></button>
        </nav>
      </div>
      <button type="button" class="add-task" id="addTask">+ Task</button>
    </header>

    <div class="philosophy">List only the five tasks you will start or finish in next few hours.</div>

    <section class="tasks" id="tasks" aria-live="polite"></section>

    <footer class="footer">
      <button type="button" id="exportData">Export backup</button>
      <button type="button" id="importData">Import backup</button>
      <input class="hidden" type="file" id="importFile" accept="application/json,.json">
    </footer>
    <div class="status" id="status" role="status"></div>
  </main>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'fiveTasks.v1';
      const MAX_TASKS = 5;
      const tasksHost = document.getElementById('tasks');
      const countElement = document.getElementById('taskCount');
      const archiveCountElement = document.getElementById('archiveCount');
      const activeTab = document.getElementById('activeTab');
      const archiveTab = document.getElementById('archiveTab');
      const addTaskButton = document.getElementById('addTask');
      const exportButton = document.getElementById('exportData');
      const importButton = document.getElementById('importData');
      const importFile = document.getElementById('importFile');
      const statusElement = document.getElementById('status');

      let statusTimer;
      let editingId = null;
      let currentView = 'active';
      let dragState = null;
      let tasks = loadTasks();

      function createId() {
        return self.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function normaliseTask(source) {
        const task = source && typeof source === 'object' ? source : {};
        return {
          id: typeof task.id === 'string' && task.id ? task.id : createId(),
          requestor: String(task.requestor ?? '').slice(0, 200),
          title: String(task.title ?? '').slice(0, 300),
          description: String(task.description ?? '').slice(0, 5000),
          archived: Boolean(task.archived),
          archivedAt: task.archivedAt ? String(task.archivedAt) : null,
          actions: Array.isArray(task.actions)
            ? task.actions.slice(0, 500).map(action => ({
                id: typeof action?.id === 'string' && action.id ? action.id : createId(),
                text: String(action?.text ?? '').slice(0, 1000),
                done: Boolean(action?.done)
              }))
            : []
        };
      }

      function newTask() {
        return {
          id: createId(),
          requestor: '',
          title: '',
          description: '',
          archived: false,
          archivedAt: null,
          actions: [{ id: createId(), text: '', done: false }]
        };
      }

      function loadTasks() {
        try {
          const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
          return Array.isArray(raw) ? raw.map(normaliseTask) : [];
        } catch {
          return [];
        }
      }

      function save(message = '') {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
          if (message) showStatus(message);
        } catch {
          showStatus('Unable to save in browser storage');
        }
        updateHeader();
      }

      function showStatus(message) {
        clearTimeout(statusTimer);
        statusElement.textContent = message;
        statusTimer = setTimeout(() => { statusElement.textContent = ''; }, 2500);
      }

      function activeTasks() {
        return tasks.filter(task => !task.archived);
      }

      function archivedTasks() {
        return tasks
          .filter(task => task.archived)
          .sort((a, b) => String(b.archivedAt || '').localeCompare(String(a.archivedAt || '')));
      }

      function updateHeader() {
        const activeCount = activeTasks().length;
        const archiveCount = archivedTasks().length;
        countElement.textContent = `${activeCount}/${MAX_TASKS}`;
        archiveCountElement.textContent = archiveCount;
        activeTab.classList.toggle('active', currentView === 'active');
        archiveTab.classList.toggle('active', currentView === 'archive');
        activeTab.setAttribute('aria-current', currentView === 'active' ? 'page' : 'false');
        archiveTab.setAttribute('aria-current', currentView === 'archive' ? 'page' : 'false');
        addTaskButton.hidden = currentView === 'archive';
        addTaskButton.disabled = activeCount >= MAX_TASKS;
        addTaskButton.textContent = activeCount >= MAX_TASKS ? 'Limit reached' : '+ Task';
        exportButton.disabled = tasks.length === 0;
      }

      function makeButton(text, className, handler) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = className;
        button.textContent = text;
        button.addEventListener('click', handler);
        return button;
      }

      function makeInput(value, placeholder, maxLength, handler, textarea = false) {
        const input = textarea ? document.createElement('textarea') : document.createElement('input');
        if (!textarea) input.type = 'text';
        input.value = value;
        input.placeholder = placeholder;
        input.maxLength = maxLength;
        input.addEventListener('input', () => handler(input.value));
        return input;
      }

      function render() {
        tasksHost.replaceChildren();
        const visibleTasks = currentView === 'active' ? activeTasks() : archivedTasks();

        if (!visibleTasks.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.innerHTML = currentView === 'active'
            ? '<strong>No active tasks</strong>Add up to five tasks.'
            : '<strong>Archive is empty</strong>Archived tasks will appear here.';
          tasksHost.appendChild(empty);
          updateHeader();
          return;
        }

        visibleTasks.forEach((task, index) => {
          const card = document.createElement('article');
          card.className = `task${editingId === task.id ? ' editing' : ''}`;
          if (currentView === 'active' && index === 0) card.classList.add('top-focus');
          card.dataset.taskId = task.id;
          if (currentView === 'active') {
            card.append(createView(task, index), createEditor(task));
          } else {
            card.append(createArchiveView(task));
          }
          tasksHost.appendChild(card);
        });

        updateHeader();
      }

      function createView(task, index) {
        const view = document.createElement('div');
        view.className = 'task-view';

        const handle = document.createElement('button');
        handle.type = 'button';
        handle.className = 'drag-handle';
        handle.textContent = '⋮⋮';
        handle.setAttribute('aria-label', `Reorder ${task.title.trim() || `task ${index + 1}`}`);
        handle.title = 'Hold and drag to reorder';
        handle.addEventListener('pointerdown', event => startReorder(event, task.id));

        const content = document.createElement('div');
        content.className = 'task-content';

        const requestor = document.createElement('div');
        requestor.className = 'requestor';
        requestor.textContent = task.requestor.trim() || `TASK ${index + 1}`;

        const titleRow = document.createElement('div');
        titleRow.className = 'title-row';

        const title = document.createElement('div');
        title.className = 'task-title';
        title.textContent = task.title.trim() || 'Untitled task';

        const edit = makeButton('Edit', 'edit-button', () => {
          editingId = task.id;
          render();
          requestAnimationFrame(() => {
            const card = tasksHost.querySelector(`[data-task-id="${CSS.escape(task.id)}"]`);
            card?.querySelector('input')?.focus();
          });
        });

        titleRow.append(title, edit);
        content.append(requestor, titleRow);

        if (task.description.trim()) {
          const description = document.createElement('p');
          description.className = 'description';
          description.textContent = task.description;
          content.appendChild(description);
        }

        if (task.actions.length) {
          const actions = document.createElement('div');
          actions.className = 'actions';

          task.actions.forEach(action => {
            const row = document.createElement('label');
            row.className = `action-view${action.done ? ' done' : ''}`;

            const check = document.createElement('input');
            check.type = 'checkbox';
            check.checked = action.done;
            check.setAttribute('aria-label', `Mark ${action.text || 'action'} complete`);
            check.addEventListener('change', () => {
              action.done = check.checked;
              save();
              render();
            });

            const text = document.createElement('span');
            text.className = 'action-text';
            text.textContent = action.text.trim() || 'Untitled action';
            row.append(check, text);
            actions.appendChild(row);
          });

          content.appendChild(actions);
        } else {
          const noActions = document.createElement('div');
          noActions.className = 'no-actions';
          noActions.textContent = 'No next actions';
          content.appendChild(noActions);
        }

        view.append(handle, content);
        return view;
      }

      function startReorder(event, taskId) {
        if (event.button !== undefined && event.button !== 0) return;
        const active = activeTasks();
        const sourceIndex = active.findIndex(task => task.id === taskId);
        const sourceCard = tasksHost.querySelector(`[data-task-id="${CSS.escape(taskId)}"]`);
        if (sourceIndex < 0 || !sourceCard) return;

        event.preventDefault();
        event.currentTarget.setPointerCapture?.(event.pointerId);
        dragState = {
          pointerId: event.pointerId,
          taskId,
          sourceIndex,
          targetIndex: sourceIndex,
          insertAfter: false,
          handle: event.currentTarget,
          sourceCard
        };
        sourceCard.classList.add('dragging');
        document.body.classList.add('reordering');
        document.addEventListener('pointermove', moveReorder, { passive: false });
        document.addEventListener('pointerup', finishReorder);
        document.addEventListener('pointercancel', cancelReorder);
      }

      function moveReorder(event) {
        if (!dragState || event.pointerId !== dragState.pointerId) return;
        event.preventDefault();
        clearDropMarkers();

        const cards = [...tasksHost.querySelectorAll('.task')];
        let target = null;
        for (const card of cards) {
          if (card === dragState.sourceCard) continue;
          const rect = card.getBoundingClientRect();
          if (event.clientY >= rect.top && event.clientY <= rect.bottom) {
            target = card;
            const targetId = card.dataset.taskId;
            dragState.targetIndex = activeTasks().findIndex(task => task.id === targetId);
            dragState.insertAfter = event.clientY > rect.top + rect.height / 2;
            card.classList.add(dragState.insertAfter ? 'drag-over-after' : 'drag-over-before');
            break;
          }
        }

        const edge = 70;
        if (event.clientY < edge) window.scrollBy(0, -8);
        else if (event.clientY > window.innerHeight - edge) window.scrollBy(0, 8);
      }

      function finishReorder(event) {
        if (!dragState || event.pointerId !== dragState.pointerId) return;
        const { sourceIndex, targetIndex, insertAfter } = dragState;
        cleanupReorder();

        if (targetIndex === sourceIndex) return;
        const active = activeTasks();
        const archived = tasks.filter(task => task.archived);
        const [moved] = active.splice(sourceIndex, 1);
        let destination = targetIndex;
        if (sourceIndex < targetIndex) destination -= 1;
        if (insertAfter) destination += 1;
        destination = Math.max(0, Math.min(destination, active.length));
        active.splice(destination, 0, moved);
        tasks = [...active, ...archived];
        save('Order saved');
        render();
      }

      function cancelReorder(event) {
        if (!dragState || event.pointerId !== dragState.pointerId) return;
        cleanupReorder();
      }

      function clearDropMarkers() {
        tasksHost.querySelectorAll('.drag-over-before, .drag-over-after').forEach(card => {
          card.classList.remove('drag-over-before', 'drag-over-after');
        });
      }

      function cleanupReorder() {
        if (!dragState) return;
        dragState.sourceCard.classList.remove('dragging');
        dragState.handle.releasePointerCapture?.(dragState.pointerId);
        clearDropMarkers();
        document.body.classList.remove('reordering');
        document.removeEventListener('pointermove', moveReorder);
        document.removeEventListener('pointerup', finishReorder);
        document.removeEventListener('pointercancel', cancelReorder);
        dragState = null;
      }

      function createArchiveView(task) {
        const view = document.createElement('div');
        view.className = 'archive-card';

        const requestor = document.createElement('div');
        requestor.className = 'requestor';
        requestor.textContent = task.requestor.trim() || 'ARCHIVED TASK';

        const title = document.createElement('div');
        title.className = 'task-title';
        title.textContent = task.title.trim() || 'Untitled task';
        view.append(requestor, title);

        if (task.description.trim()) {
          const description = document.createElement('p');
          description.className = 'description';
          description.textContent = task.description;
          view.appendChild(description);
        }

        if (task.actions.length) {
          const actions = document.createElement('div');
          actions.className = 'archive-actions-static';
          task.actions.forEach(action => {
            const row = document.createElement('div');
            row.className = `archive-action-static${action.done ? ' done' : ''}`;
            const mark = document.createElement('span');
            mark.textContent = action.done ? '✓' : '○';
            const text = document.createElement('span');
            text.textContent = action.text.trim() || 'Untitled action';
            row.append(mark, text);
            actions.appendChild(row);
          });
          view.appendChild(actions);
        }

        const archivedDate = document.createElement('div');
        archivedDate.className = 'archive-date';
        const date = task.archivedAt ? new Date(task.archivedAt) : null;
        archivedDate.textContent = date && !Number.isNaN(date.getTime())
          ? `Archived ${date.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' })}`
          : 'Archived';

        const tools = document.createElement('div');
        tools.className = 'archive-tools';
        const restore = makeButton('Restore', 'restore-task', () => restoreTask(task.id));
        const remove = makeButton('Delete', 'delete-task', () => {
          if (!confirm(`Permanently delete "${task.title.trim() || 'Untitled task'}"?`)) return;
          tasks = tasks.filter(item => item.id !== task.id);
          save('Archived task deleted');
          render();
        });
        tools.append(restore, remove);
        view.append(archivedDate, tools);
        return view;
      }

      function archiveTask(taskId) {
        const task = tasks.find(item => item.id === taskId);
        if (!task) return;
        task.archived = true;
        task.archivedAt = new Date().toISOString();
        editingId = null;
        save('Task archived');
        render();
      }

      function restoreTask(taskId) {
        if (activeTasks().length >= MAX_TASKS) {
          showStatus('Five active tasks already exist');
          return;
        }
        const task = tasks.find(item => item.id === taskId);
        if (!task) return;
        task.archived = false;
        task.archivedAt = null;
        save('Task restored');
        render();
      }

      function createEditor(task) {
        const editor = document.createElement('div');
        editor.className = 'task-editor';

        const requestorField = document.createElement('div');
        requestorField.className = 'field';
        requestorField.appendChild(makeInput(task.requestor, 'Requestor / Project', 200, value => {
          task.requestor = value.toUpperCase();
          save();
        }));

        const titleField = document.createElement('div');
        titleField.className = 'field';
        titleField.appendChild(makeInput(task.title, 'Task title', 300, value => {
          task.title = value.toUpperCase();
          save();
        }));

        const descriptionField = document.createElement('div');
        descriptionField.className = 'field';
        descriptionField.appendChild(makeInput(task.description, 'Description', 5000, value => {
          task.description = value;
          save();
        }, true));

        const heading = document.createElement('div');
        heading.className = 'editor-heading';
        heading.textContent = 'Next actions';

        const actionList = document.createElement('div');
        actionList.className = 'action-edit-list';

        task.actions.forEach(action => {
          const row = document.createElement('div');
          row.className = 'action-edit-row';
          const input = makeInput(action.text, 'Next action', 1000, value => {
            action.text = value;
            save();
          });
          input.addEventListener('keydown', event => {
            if (event.key === 'Enter') {
              event.preventDefault();
              addAction(task.id);
            }
          });
          const remove = makeButton('×', 'remove-action', () => {
            if (task.actions.length === 1) {
              showStatus('A task must have at least one next action');
              return;
            }
            task.actions = task.actions.filter(item => item.id !== action.id);
            save();
            render();
          });
          remove.setAttribute('aria-label', 'Delete action');
          row.append(input, remove);
          actionList.appendChild(row);
        });

        const tools = document.createElement('div');
        tools.className = 'editor-tools';
        const addActionButton = makeButton('+ Action', 'add-action', () => addAction(task.id));
        const doneButton = makeButton('Save', '', () => {
          const hasAction = task.actions.some(action => action.text.trim().length > 0);
          if (!hasAction) {
            showStatus('Add at least one next action');
            editor.querySelector('.action-edit-row input')?.focus();
            return;
          }
          editingId = null;
          save('Saved');
          render();
        });
        const archiveButton = makeButton('Archive', 'archive-task', () => {
          const hasAction = task.actions.some(action => action.text.trim().length > 0);
          if (!hasAction) {
            showStatus('Add at least one next action');
            editor.querySelector('.action-edit-row input')?.focus();
            return;
          }
          if (!confirm(`Archive "${task.title.trim() || 'Untitled task'}"?`)) return;
          archiveTask(task.id);
        });
        const deleteButton = makeButton('Delete', 'delete-task', () => {
          if (!confirm(`Delete "${task.title.trim() || 'Untitled task'}"?`)) return;
          tasks = tasks.filter(item => item.id !== task.id);
          editingId = null;
          save('Task deleted');
          render();
        });
        tools.append(addActionButton, doneButton, archiveButton, deleteButton);

        editor.append(requestorField, titleField, descriptionField, heading, actionList, tools);
        return editor;
      }

      function addAction(taskId) {
        const task = tasks.find(item => item.id === taskId);
        if (!task) return;
        task.actions.push({ id: createId(), text: '', done: false });
        editingId = taskId;
        save();
        render();
        requestAnimationFrame(() => {
          const card = tasksHost.querySelector(`[data-task-id="${CSS.escape(taskId)}"]`);
          const actionInputs = card?.querySelectorAll('.action-edit-row input');
          actionInputs?.[actionInputs.length - 1]?.focus();
        });
      }

      activeTab.addEventListener('click', () => {
        currentView = 'active';
        editingId = null;
        render();
      });

      archiveTab.addEventListener('click', () => {
        currentView = 'archive';
        editingId = null;
        render();
      });

      addTaskButton.addEventListener('click', () => {
        if (activeTasks().length >= MAX_TASKS) return;
        const task = newTask();
        tasks.push(task);
        editingId = task.id;
        save();
        render();
        requestAnimationFrame(() => {
          const card = tasksHost.querySelector(`[data-task-id="${CSS.escape(task.id)}"]`);
          card?.querySelector('input')?.focus();
          card?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });
      });

      exportButton.addEventListener('click', () => {
        const data = {
          app: 'Five',
          version: 2.6,
          exportedAt: new Date().toISOString(),
          tasks
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `five-backup-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        showStatus('Backup exported');
      });

      importButton.addEventListener('click', () => importFile.click());

      importFile.addEventListener('change', async () => {
        const file = importFile.files?.[0];
        importFile.value = '';
        if (!file) return;
        try {
          const parsed = JSON.parse(await file.text());
          const incoming = Array.isArray(parsed) ? parsed : parsed.tasks;
          if (!Array.isArray(incoming)) throw new Error('Invalid backup');
          if (!confirm('Replace current tasks with this backup?')) return;
          let activeSeen = 0;
          tasks = incoming.map(normaliseTask).map(task => {
            if (!task.archived) {
              activeSeen += 1;
              if (activeSeen > MAX_TASKS) {
                task.archived = true;
                task.archivedAt = task.archivedAt || new Date().toISOString();
              }
            }
            return task;
          });
          editingId = null;
          currentView = 'active';
          save('Backup imported');
          render();
        } catch {
          showStatus('Could not import this backup');
        }
      });

      document.addEventListener('keydown', event => {
        const target = event.target;
        const isTyping = target instanceof HTMLElement && (
          target.matches('input, textarea, select') || target.isContentEditable
        );
        if (isTyping || event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.key.toLowerCase() !== 't') return;
        if (currentView !== 'active' || editingId || activeTasks().length >= MAX_TASKS) return;
        event.preventDefault();
        addTaskButton.click();
      });
      render();
    })();
  </script>
</body>
</html>
